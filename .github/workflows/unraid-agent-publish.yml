name: Publish Unraid Agent

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0). Defaults to version in package.json.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --match "v*" --abbrev=0)
            echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch version in unraid-agent/package.json
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" '.version = $v' unraid-agent/package.json > unraid-agent/package.json.tmp
          mv unraid-agent/package.json.tmp unraid-agent/package.json

      - name: Install dependencies
        working-directory: unraid-agent
        run: npm ci

      - name: Build
        working-directory: unraid-agent
        run: npm run build

      - name: Publish
        working-directory: unraid-agent
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
